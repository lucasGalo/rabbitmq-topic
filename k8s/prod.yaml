apiVersion: apps/v1
kind: Deployment
metadata:
  name: springboot-rabbitmq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: springboot-rabbitmq
  template:
    metadata:
      labels:
        app: springboot-rabbitmq
    spec:
      containers:
        - name: springboot-rabbitmq
          image: lucasgalo/rabbitmq-topic:0.1.3   # substitua pela sua imagem
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_RABBITMQ_HOST
              value: "rabbitmq"                # nome do Service RabbitMQ
            - name: SPRING_RABBITMQ_PORT
              value: "5672"                    # porta AMQP
            - name: SPRING_RABBITMQ_USERNAME
              value: "admin"
            - name: SPRING_RABBITMQ_PASSWORD
              value: "admin123"
            - name: SPRING_RABBITMQ_VIRTUAL_HOST
              value: "/"
---
apiVersion: v1
kind: Service
metadata:
  name: springboot-rabbitmq
spec:
  type: NodePort
  selector:
    app: springboot-rabbitmq
  ports:
    - port: 8080        # porta interna do pod
      targetPort: 8080  # porta do container
      nodePort: 30088   # porta externa válida (faixa 30000–32767)
      protocol: TCP
      name: http
