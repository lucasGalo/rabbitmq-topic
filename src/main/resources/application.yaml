spring:
  application:
    name: RabbitMQ-Topic

  rabbitmq:
    host: rabbitmq      # 192.168.0.100 rabbitmq
    port: 5672          # Porta AMQP correta
    username: admin     # usuário definido no docker-compose
    password: admin123  # senha definida no docker-compose
    virtual-host: /
# ===============================
# = OPENZIPKIN
# ===============================
  zipkin:
    base-url: http://zipkin:9411
  sleuth:
    sampler:
      probability: 1.0


server:
  port: ${SERVER_PORT:8082}


# ===============================
# = ACTUATOR
# ===============================
management:
  endpoints:
    web:
      exposure:
        include: [ "prometheus" ]
  metrics:
    tags:
      application: ${spring.application.name}
    export:
      prometheus:
        enabled: true
